
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像からPDFへの変換ツール</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            color: #333;
        }

        .box {
            border: 2px dashed #007bff;
            background-color: #f8fafc;
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        #fileInput {
            display: none;
        }

        .select-label {
            background-color: #007bff;
            color: white;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            display: inline-block;
            transition: 0.2s;
        }

        .select-label:hover {
            background-color: #0056b3;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            background-color: transparent;
            color: #333;
            padding: 0;
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            display: block;
            width: 100%;
            margin-top: 10px;
            transition: 0.2s;
        }

        button:hover {
            background-color: #218838;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #fileList {
            margin-top: 15px;
            background: #fff;
            border: 1px solid #e2e8f0;
            padding: 10px;
            border-radius: 5px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
        }

        .file-item {
            font-size: 14px;
            margin-bottom: 4px;
            color: #4a5568;
            word-break: break-all;
        }

        #status {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            color: #555;
        }
    </style>
</head>
<body>

    <h1>画像からPDFを作成</h1>

    <p style="font-size: 13px; color: #666;">
        外部接続なしで安全にブラウザ内だけでPDFに変換します。
        JPEG、PNG、GIF、BMP、WebPなどに対応しています。
    </p>

    <div class="box">
        <label for="fileInput" class="select-label">
            画像ファイルを選択
        </label>

        <input type="file" id="fileInput" accept="image/*" multiple>

        <div id="fileList">
            <span style="color: #999;">ファイルが選択されていません</span>
        </div>
    </div>

    <div class="input-group">
        <label for="pdfNameInput">保存するPDFのファイル名</label>
        <input type="text" id="pdfNameInput"
               placeholder="images (未入力の場合は images.pdf になります)">
    </div>

    <button id="createPdfBtn" disabled>
        PDFを作成してダウンロード
    </button>

    <div id="status"></div>

    <script>

        // ==========================================
        // 画像をJPEG形式に変換する
        // ==========================================

        async function convertImageToJpeg(file) {

            return new Promise((resolve, reject) => {

                const img = new Image();
                const objectUrl = URL.createObjectURL(file);

                img.onload = async () => {

                    try {

                        const canvas = document.createElement('canvas');

                        canvas.width = img.naturalWidth || img.width;
                        canvas.height = img.naturalHeight || img.height;

                        const ctx = canvas.getContext('2d');

                        if (!ctx) {
                            throw new Error('Canvasを利用できません');
                        }

                        // 透明部分を白色にする
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);

                        // 画像を描画
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                        // JPEG形式に変換
                        canvas.toBlob(async (blob) => {

                            if (!blob) {
                                reject(new Error('画像変換に失敗しました'));
                                return;
                            }

                            try {

                                const arrayBuffer = await blob.arrayBuffer();

                                resolve({
                                    bytes: new Uint8Array(arrayBuffer),
                                    width: canvas.width,
                                    height: canvas.height
                                });

                            } catch (error) {
                                reject(error);
                            }

                        }, 'image/jpeg', 0.95);

                    } catch (error) {
                        reject(error);
                    } finally {
                        URL.revokeObjectURL(objectUrl);
                    }
                };

                img.onerror = () => {
                    URL.revokeObjectURL(objectUrl);
                    reject(new Error('画像を読み込めません: ' + file.name));
                };

                img.src = objectUrl;
            });
        }


        // ==========================================
        // PDFを作成する関数
        // ==========================================

        function generateSimplePdfFromImages(images) {

            let objects = [];
            let catalogObjNum = 1;
            let pagesObjNum = 2;
            let currentObjNum = 3;

            let pageObjectNums = [];

            for (let i = 0; i < images.length; i++) {

                let img = images[i];

                let imgObjNum = currentObjNum++;
                let contentObjNum = currentObjNum++;
                let pageObjNum = currentObjNum++;

                pageObjectNums.push(pageObjNum);

                // JPEGデータをPDFに埋め込む
                let imgHeader =
                    `<< /Type /XObject /Subtype /Image ` +
                    `/Width ${img.width} /Height ${img.height} ` +
                    `/ColorSpace /DeviceRGB /BitsPerComponent 8 ` +
                    `/Filter /DCTDecode /Length ${img.bytes.length} >>\nstream\n`;

                let imgFooter = "\nendstream\n";

                // ページ内に画像を配置
                let contentStream =
                    `q\n${img.width} 0 0 ${img.height} 0 0 cm\n` +
                    `/Im${i} Do\nQ\n`;

                let contentBytes = new TextEncoder().encode(contentStream);

                let contentHeader =
                    `<< /Length ${contentBytes.length} >>\nstream\n`;

                let contentFooter = "endstream\n";

                objects.push({
                    num: imgObjNum,
                    header: imgHeader,
                    body: img.bytes,
                    footer: imgFooter
                });

                objects.push({
                    num: contentObjNum,
                    header: contentHeader,
                    body: contentBytes,
                    footer: contentFooter
                });

                // PDFページを作成
                let pageHeader =
                    `<< /Type /Page /Parent ${pagesObjNum} 0 R ` +
                    `/MediaBox [0 0 ${img.width} ${img.height}] ` +
                    `/Contents ${contentObjNum} 0 R ` +
                    `/Resources << /XObject << /Im${i} ${imgObjNum} 0 R >> >> >>\n`;

                objects.push({
                    num: pageObjNum,
                    header: pageHeader,
                    body: new Uint8Array(),
                    footer: ""
                });
            }

            // ページ一覧
            let pagesKids = pageObjectNums
                .map(n => `${n} 0 R`)
                .join(" ");

            let pagesHeader =
                `<< /Type /Pages /Kids [${pagesKids}] ` +
                `/Count ${images.length} >>\n`;

            let catalogHeader =
                `<< /Type /Catalog /Pages ${pagesObjNum} 0 R >>\n`;

            objects.unshift({
                num: pagesObjNum,
                header: pagesHeader,
                body: new Uint8Array(),
                footer: ""
            });

            objects.unshift({
                num: catalogObjNum,
                header: catalogHeader,
                body: new Uint8Array(),
                footer: ""
            });

            // PDFのバイナリ構築
            let offsets = {};

            let headerBytes = new TextEncoder().encode("%PDF-1.4\n");

            let totalLength = headerBytes.length;

            let finalBuffers = [headerBytes];

            for (let obj of objects) {

                offsets[obj.num] = totalLength;

                let objHead =
                    `${obj.num} 0 obj\n${obj.header}`;

                let objFoot =
                    obj.footer + "endobj\n";

                let headBytes = new TextEncoder().encode(objHead);
                let footBytes = new TextEncoder().encode(objFoot);

                finalBuffers.push(headBytes, obj.body, footBytes);

                totalLength +=
                    headBytes.length +
                    obj.body.length +
                    footBytes.length;
            }

            // xref
            let startxref = totalLength;

            let xref = `xref\n0 ${currentObjNum}\n`;
            xref += `0000000000 65535 f \n`;

            for (let i = 1; i < currentObjNum; i++) {

                let offsetStr =
                    String(offsets[i]).padStart(10, '0');

                xref += `${offsetStr} 00000 n \n`;
            }

            let trailer =
                `trailer\n` +
                `<< /Size ${currentObjNum} /Root ${catalogObjNum} 0 R >>\n` +
                `startxref\n${startxref}\n%%EOF\n`;

            finalBuffers.push(
                new TextEncoder().encode(xref + trailer)
            );

            return new Blob(finalBuffers, {
                type: "application/pdf"
            });
        }


        // ==========================================
        // 画面制御
        // ==========================================

        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const createPdfBtn = document.getElementById('createPdfBtn');
        const pdfNameInput = document.getElementById('pdfNameInput');
        const status = document.getElementById('status');

        let selectedFiles = [];

        // ファイル選択
        fileInput.addEventListener('change', (event) => {

            selectedFiles = Array.from(event.target.files);

            if (selectedFiles.length > 0) {

                fileList.innerHTML = selectedFiles.map(file =>
                    `<div class="file-item">・ ${escapeHtml(file.name)}</div>`
                ).join('');

                createPdfBtn.disabled = false;

            } else {

                fileList.innerHTML =
                    '<span style="color: #999;">ファイルが選択されていません</span>';

                createPdfBtn.disabled = true;
            }

            status.textContent = '';
        });


        // HTMLへの文字列埋め込み時の安全処理
        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function (m) {
                return ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                })[m];
            });
        }


        // PDF作成
        createPdfBtn.addEventListener('click', async () => {

            if (selectedFiles.length === 0) return;

            createPdfBtn.textContent = 'PDFを作成中...';
            createPdfBtn.disabled = true;

            status.textContent = '画像を変換しています...';

            try {

                let imageDataArray = [];

                for (let i = 0; i < selectedFiles.length; i++) {

                    const file = selectedFiles[i];

                    status.textContent =
                        `画像を変換しています... (${i + 1}/${selectedFiles.length})`;

                    // 画像形式に関係なくJPEGへ変換
                    const imageData = await convertImageToJpeg(file);

                    imageDataArray.push(imageData);
                }

                status.textContent = 'PDFを作成しています...';

                const pdfBlob =
                    generateSimplePdfFromImages(imageDataArray);

                // ファイル名
                let filename = pdfNameInput.value.trim();

                if (!filename) {
                    filename = 'images.pdf';
                } else if (!filename.toLowerCase().endsWith('.pdf')) {
                    filename += '.pdf';
                }

                // ダウンロード
                const link = document.createElement('a');

                const downloadUrl = URL.createObjectURL(pdfBlob);

                link.href = downloadUrl;
                link.download = filename;

                document.body.appendChild(link);
                link.click();
                link.remove();

                setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);

                status.textContent = 'PDFの作成が完了しました。';

            } catch (error) {

                console.error('PDF作成エラー:', error);

                status.textContent = '';

                alert(
                    'PDFの作成に失敗しました。\n' +
                    error.message
                );

            } finally {

                createPdfBtn.textContent = 'PDFを作成してダウンロード';
                createPdfBtn.disabled = selectedFiles.length === 0;
            }
        });

    </script>

</body>
</html>

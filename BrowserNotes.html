<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Notes</title>
    
    <style>
        body {
            font-size: 16px; 
            line-height: 1.2;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* 上部コントロールエリア */
        .controls {
            padding: 10px;
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            align-items: center;
        }

        input[type="button"] {
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #eee;
            border-radius: 4px;
            font-family: inherit;
        }

        input[type="button"]:hover {
            background: #e0e0e0;
        }

        /* メインのレイアウト（左サイドバー、右エディタ） */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 左側メモ一覧（サイドバー） */
        .sidebar {
            width: 125px;
            background: #fafafa;
            border-right: 1px solid #ddd;
            overflow-y: auto;
            padding: 10px 0;
            box-sizing: border-box;
            transition: margin-left 0.2s ease;
        }

        .sidebar.closed {
            margin-left: -126px;
        }

        .sidebar-title {
            font-size: 12px;
            color: #666;
            padding: 0 10px 5px 10px;
            border-bottom: 1px solid #eee;
            margin-bottom: 5px;
        }

        .note-item {
            padding: 12px 10px;
            cursor: pointer;
            font-size: 13px;
            border-bottom: 1px solid #f0f0f0;
            word-break: break-all;
        }

        .note-item:hover {
            background: #f0f0f0;
        }

        .note-item.active {
            background: #e0e0e0;
            font-weight: bold;
        }

        /* 右側エディタエリア */
        .editor-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        #pagetitle {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            font-size: 16px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            font-family: inherit;
        }

        #textarea {
            outline: none;
            width: 100%;
            flex: 1;
            min-height: 350px;
            padding: 10px 0;
            box-sizing: border-box;
            background-color: #fff;
            border: none;
            font-size: 18px;
            white-space: pre-wrap;
            word-break: break-all;
            overflow-wrap: break-word;
        }

        /* 画像サイズ変更用ラッパー要素のスタイル */
        .resizable-img-wrapper {
            display: inline-block;
            position: relative;
            max-width: 100%;
            vertical-align: bottom;
            margin: 5px;
            user-select: none;
        }

        .resizable-img-wrapper img {
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
        }

        /* 選択時の枠線表示 */
        .resizable-img-wrapper.selected {
            outline: 2px solid #007bff;
        }

        /* 右下のサイズ調整ハンドル */
        .resizable-img-wrapper .resize-handle {
            display: none;
            position: absolute;
            right: -6px;
            bottom: -6px;
            width: 12px;
            height: 12px;
            background-color: #007bff;
            border: 1px solid #fff;
            cursor: se-resize;
            border-radius: 2px;
            z-index: 10;
        }

        .resizable-img-wrapper.selected .resize-handle {
            display: block;
        }

        hr {
            border: 0;
            border-top: 1px solid #eee;
            margin: 10px 0;
            width: 100%;
        }

        @media print {
            body {
                height: auto;
                background: #fff;
            }
            .controls, .sidebar, label, hr, .resize-handle {
                display: none !important;
            }
            .resizable-img-wrapper.selected {
                outline: none !important;
            }
            #pagetitle {
                border: none !important;
                padding: 0 !important;
                font-size: 24px !important;
                font-weight: bold !important;
                margin-bottom: 20px !important;
            }
            .main-container, .editor-container {
                display: block !important;
                overflow: visible !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            #textarea {
                min-height: auto !important;
                padding: 0 !important;
            }
        }
    </style>
</head>

<body>
    <div class="controls">
        <input type="button" value="一覧表示/非表示" onclick="toggleSidebar();" style="background: #ddd; font-weight: bold;"/>
        
        <input type="button" value="新規メモ" onclick="createNewNote();"/>
        <input type="button" value="書式をクリア" onclick="clearFormatting();"/>
        <input type="button" value="本文を消去" onclick="clearTextarea();"/>
        <input type="button" value="全体をHTML出力" onclick="exportHTML();"/>
        <input type="button" value="本文のみHTML出力" onclick="exportTextareaHTML();"/>
        <input type="button" value="本文を画像ダウンロード" onclick="exportTextareaImage();"/>
        <input type="button" value="PDF出力" onclick="exportPDF();"/>
        <input type="button" value="メモ削除" onclick="deleteCurrentNote();"/>
    </div>

    <div class="main-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-title">メモ一覧</div>
            <div id="noteList"></div>
        </div>

        <div class="editor-container">
            <label style="font-size: 12px; color: #666;">保存ファイル名（メモのタイトル）：</label>
            <input type="text" id="pagetitle" value="MyNote" oninput="updateTitle(this.value)">
            <hr>
            <div id="textarea" contentEditable="true"></div>
        </div>
    </div>

    <script type="text/javascript">
        const sidebar = document.getElementById('sidebar');
        const editor = document.getElementById('textarea');
        const titleInput = document.getElementById('pagetitle');
        const noteListContainer = document.getElementById('noteList');

        let notes = [];         
        let currentNoteId = ""; 

        // ページ読み込み時の処理
        window.addEventListener('load', function(){
            const savedNotes = localStorage.getItem('multi_notes');
            const savedCurrentId = localStorage.getItem('current_note_id');
            
            const sidebarStatus = localStorage.getItem('sidebar_status');
            if (sidebarStatus === 'closed') {
                sidebar.classList.add('closed');
            }

            if (savedNotes) {
                notes = JSON.parse(savedNotes);
            }

            if (notes.length === 0) {
                const defaultId = Date.now().toString();
                notes.push({
                    id: defaultId,
                    title: "MyNote",
                    content: "ここに内容を入力してください。"
                });
                currentNoteId = defaultId;
            } else {
                currentNoteId = savedCurrentId && notes.some(n => n.id === savedCurrentId) ? savedCurrentId : notes[0].id;
            }

            updateSidebarList();
            loadNote(currentNoteId);
            setupImageResizer();
        });

        window.addEventListener('beforeunload', saveCurrentData);

        function toggleSidebar() {
            sidebar.classList.toggle('closed');
            if (sidebar.classList.contains('closed')) {
                localStorage.setItem('sidebar_status', 'closed');
            } else {
                localStorage.setItem('sidebar_status', 'opened');
            }
        }

        function saveCurrentData() {
            deselectAllImages();
            const currentNote = notes.find(n => n.id === currentNoteId);
            if (currentNote) {
                currentNote.title = titleInput.value;
                currentNote.content = editor.innerHTML;
            }
            localStorage.setItem('multi_notes', JSON.stringify(notes));
            localStorage.setItem('current_note_id', currentNoteId);
        }

        function loadNote(id) {
            const note = notes.find(n => n.id === id);
            if (note) {
                currentNoteId = id;
                titleInput.value = note.title;
                editor.innerHTML = note.content;
                
                const items = noteListContainer.querySelectorAll('.note-item');
                items.forEach(item => {
                    if (item.getAttribute('data-id') === id) {
                        item.classList.add('active');
                    } else {
                        item.classList.remove('active');
                    }
                });
                wrapUnwrappedImages();
            }
        }

        function updateSidebarList() {
            noteListContainer.innerHTML = "";
            notes.forEach(note => {
                const div = document.createElement('div');
                div.className = 'note-item';
                div.setAttribute('data-id', note.id);
                div.textContent = note.title || "(無題のメモ)";
                
                div.addEventListener('click', function() {
                    changeNote(note.id);
                });

                if (note.id === currentNoteId) {
                    div.classList.add('active');
                }
                
                noteListContainer.appendChild(div);
            });
        }

        function updateTitle(newTitle) {
            const currentNote = notes.find(n => n.id === currentNoteId);
            if (currentNote) {
                currentNote.title = newTitle;
                const item = noteListContainer.querySelector(`.note-item[data-id="${currentNoteId}"]`);
                if (item) item.textContent = newTitle || "(無題のメモ)";
            }
        }

        function changeNote(id) {
            if (id === currentNoteId) return; 
            saveCurrentData(); 
            loadNote(id);
        }

        function createNewNote() {
            saveCurrentData(); 
            
            const newId = Date.now().toString();
            const newNote = {
                id: newId,
                title: "新規メモ",
                content: ""
            };
            notes.push(newNote);
            
            updateSidebarList();
            loadNote(newId);
        }

        function deleteCurrentNote() {
            if (notes.length <= 1) {
                alert("これ以上メモを削除できません（最低1つのメモが必要です）。");
                return;
            }

            if (confirm(`「${titleInput.value}」を削除しますか？`)) {
                notes = notes.filter(n => n.id !== currentNoteId);
                currentNoteId = notes[0].id;
                
                updateSidebarList();
                loadNote(currentNoteId);
                saveCurrentData();
            }
        }

        function exportHTML(){
            saveCurrentData();
            const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { "type" : "text/html" });
            saveFile(URL.createObjectURL(blob), titleInput.value + "_app.html");
        }

        function buildTextareaHTML(){
            const noteContent = editor.innerHTML;
            const safeTitle = titleInput.value
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");

            // 「本文のみHTML出力」と画像化の両方で、まったく同じHTMLを使用します。
            return `<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>${safeTitle}</title>
    <style>
        body { padding: 20px; line-height: 1.6; }
        .resizable-img-wrapper { display: inline-block; max-width: 100%; margin: 5px; }
        .resizable-img-wrapper img { display: block; width: 100%; height: auto; max-width: 100%; }
        .resize-handle { display: none !important; }
    </style>
</head>
<body>
    <h1>${safeTitle}</h1>
    <hr>
    <div>${noteContent}</div>
</body>
</html>`;
        }

        function exportTextareaHTML(){
            saveCurrentData();
            deselectAllImages();
            const htmlContent = buildTextareaHTML();
            const blob = new Blob([htmlContent], { "type" : "text/html" });
            saveFile(URL.createObjectURL(blob), titleInput.value + ".html");
        }

        // 「本文のみHTML出力」で作られるHTMLを実際にブラウザでレイアウトし、
        // その表示結果をJPEGにします。本文を手作業で再配置する方式ではありません。
        async function exportTextareaImage(){
            saveCurrentData();
            deselectAllImages();

            const htmlContent = buildTextareaHTML();
            const iframe = document.createElement('iframe');
            iframe.setAttribute('aria-hidden', 'true');
            iframe.style.position = 'fixed';
            iframe.style.left = '-100000px';
            iframe.style.top = '0';
            iframe.style.width = Math.max(320, editor.clientWidth || 900) + 'px';
            iframe.style.height = '100px';
            iframe.style.border = '0';
            iframe.style.visibility = 'hidden';
            document.body.appendChild(iframe);

            try {
                iframe.srcdoc = htmlContent;
                await new Promise((resolve, reject) => {
                    const timer = setTimeout(() => reject(new Error('HTMLの読み込みがタイムアウトしました。')), 15000);
                    iframe.addEventListener('load', () => { clearTimeout(timer); resolve(); }, {once:true});
                });

                const doc = iframe.contentDocument;
                const win = iframe.contentWindow;
                if (!doc || !doc.body) throw new Error('HTMLを画像化する領域を取得できませんでした。');

                const images = Array.from(doc.images);
                await Promise.all(images.map(img => {
                    if (img.complete && img.naturalWidth > 0) return Promise.resolve();
                    return new Promise(resolve => {
                        img.addEventListener('load', resolve, {once:true});
                        img.addEventListener('error', resolve, {once:true});
                    });
                }));

                // 画像の自然サイズがレイアウトへ反映されるまで再計算。
                await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

                const bodyRect = doc.body.getBoundingClientRect();
                const width = Math.ceil(Math.max(doc.documentElement.scrollWidth, doc.body.scrollWidth, bodyRect.right));
                const height = Math.ceil(Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight, bodyRect.bottom));
                const scale = 2;

                const canvas = document.createElement('canvas');
                canvas.width = Math.max(1, width * scale);
                canvas.height = Math.max(1, height * scale);
                const ctx = canvas.getContext('2d', {alpha:false});
                ctx.scale(scale, scale);
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, width, height);

                const all = [];
                const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
                let node;
                while ((node = walker.nextNode())) all.push(node);

                const viewport = {x:0, y:0};
                const rectOf = el => {
                    const r = el.getBoundingClientRect();
                    return {left:r.left-viewport.x, top:r.top-viewport.y, width:r.width, height:r.height};
                };

                // 背景・罫線を先に描画。
                for (const item of all) {
                    if (item.nodeType !== Node.ELEMENT_NODE) continue;
                    const el = item;
                    if (el.tagName === 'IMG') continue;
                    const cs = win.getComputedStyle(el);
                    const r = rectOf(el);
                    if (r.width <= 0 || r.height <= 0) continue;
                    if (cs.backgroundColor && cs.backgroundColor !== 'rgba(0, 0, 0, 0)' && cs.backgroundColor !== 'transparent') {
                        ctx.fillStyle = cs.backgroundColor;
                        ctx.fillRect(r.left, r.top, r.width, r.height);
                    }
                    drawBorder(ctx, r, cs, 'Top');
                    drawBorder(ctx, r, cs, 'Right');
                    drawBorder(ctx, r, cs, 'Bottom');
                    drawBorder(ctx, r, cs, 'Left');
                }

                // HTMLのDOM順に、文字と画像を描画。
                for (const item of all) {
                    if (item.nodeType === Node.ELEMENT_NODE) {
                        const el = item;
                        if (el.tagName === 'IMG') {
                            const r = rectOf(el);
                            if (r.width <= 0 || r.height <= 0) continue;
                            try {
                                const source = await imageForCanvas(el);
                                if (source) ctx.drawImage(source, r.left, r.top, r.width, r.height);
                            } catch(e) {
                                // 画像1枚の失敗で本文全体の出力を止めない。
                            }
                        }
                    } else if (item.nodeType === Node.TEXT_NODE) {
                        drawTextNode(ctx, win, item, rectOf);
                    }
                }

                const jpegBlob = await new Promise((resolve, reject) => {
                    canvas.toBlob(b => b ? resolve(b) : reject(new Error('JPEGの生成に失敗しました。')), 'image/jpeg', 0.92);
                });

                // メタデータは付加せず、HTMLの表示結果をそのままJPEGとして保存
                saveFile(URL.createObjectURL(jpegBlob), titleInput.value + '.jpg');
            } catch (err) {
                console.error(err);
                alert('画像の作成中にエラーが発生しました。\n' + (err && err.message ? err.message : err));
            } finally {
                iframe.remove();
            }
        }

        function drawBorder(ctx, r, cs, side){
            const width = parseFloat(cs['border' + side + 'Width']) || 0;
            const style = cs['border' + side + 'Style'];
            if (!width || style === 'none') return;
            ctx.fillStyle = cs['border' + side + 'Color'] || '#000';
            if (side === 'Top') ctx.fillRect(r.left, r.top, r.width, width);
            if (side === 'Bottom') ctx.fillRect(r.left, r.top + r.height - width, r.width, width);
            if (side === 'Left') ctx.fillRect(r.left, r.top, width, r.height);
            if (side === 'Right') ctx.fillRect(r.left + r.width - width, r.top, width, r.height);
        }

        function drawTextNode(ctx, win, node, rectOf){
            const text = node.nodeValue || '';
            if (!text.trim() && !/[\u3000]/.test(text)) return;
            const parent = node.parentElement;
            if (!parent) return;
            const cs = win.getComputedStyle(parent);
            if (cs.display === 'none' || cs.visibility === 'hidden') return;

            const font = [cs.fontStyle, cs.fontVariant, cs.fontWeight, cs.fontSize, cs.fontFamily].join(' ');
            ctx.font = font;
            ctx.fillStyle = cs.color || '#000';
            ctx.textBaseline = 'alphabetic';
            ctx.textAlign = 'left';

            const range = win.document.createRange();
            const lines = new Map();
            for (let i=0; i<text.length; i++) {
                range.setStart(node, i);
                range.setEnd(node, i+1);
                const rs = Array.from(range.getClientRects());
                if (!rs.length) continue;
                const r = rs[0];
                const top = Math.round(r.top * 10) / 10;
                if (!lines.has(top)) lines.set(top, []);
                lines.get(top).push({char:text[i], left:r.left, width:r.width});
            }

            const fs = parseFloat(cs.fontSize) || 16;
            const lineHeight = cs.lineHeight === 'normal' ? fs * 1.2 : (parseFloat(cs.lineHeight) || fs * 1.2);
            for (const [top, chars] of lines) {
                if (!chars.length) continue;
                const str = chars.map(x => x.char).join('');
                let left = chars[0].left;
                // Rangeの位置はiframeのviewport基準なので、そのまま画像座標へ移す。
                const baseline = top + (lineHeight + fs) / 2;
                ctx.fillText(str, left, baseline);
            }
        }

        async function imageForCanvas(el){
            const src = el.currentSrc || el.src;
            if (!src) return null;
            const image = new Image();
            image.decoding = 'sync';
            return new Promise((resolve, reject) => {
                image.onload = () => resolve(image);
                image.onerror = reject;
                image.src = src;
            });
        }

        function getEditorPlainText(){
            return (editor.innerText || editor.textContent || '').replace(/\r\n/g, '\n');
        }

        
        function exportPDF() {
            saveCurrentData();
            deselectAllImages();
            
            const originalTitle = document.title;
            document.title = titleInput.value;
            
            window.print();
            
            document.title = originalTitle;
        }

        function saveFile(url, filename) {
            let link = document.createElement('a'); 
            link.href = url;
            link.download = filename;
            link.click();
        }

        // 本文（#textarea）のみをクリアする関数
        function clearTextarea() {
            if (confirm("本文の内容をすべて消去しますか？")) {
                editor.innerHTML = "";
                saveCurrentData();
            }
        }

        // 既存の装飾を解除してプレーンテキスト化する関数
        function clearFormatting() {
            const selection = window.getSelection();
            if (selection.rangeCount > 0 && !selection.isCollapsed) {
                const text = selection.toString();
                document.execCommand('insertText', false, text);
            } else {
                if (editor.innerText.trim() !== "" && confirm("本文全体の書式（文字色やサイズ等）をクリアしますか？\n（※画像も消去されます）")) {
                    editor.innerText = editor.innerText;
                }
            }
            saveCurrentData();
        }

        // 貼り付け（ペースト）時の処理
        editor.addEventListener('paste', function (e) {
            const items = e.clipboardData && e.clipboardData.items;
            let hasImage = false;
            if (items) {
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf('image') !== -1) {
                        hasImage = true;
                        break;
                    }
                }
            }

            if (!hasImage) {
                e.preventDefault();
                const text = e.clipboardData.getData('text/plain');
                document.execCommand('insertText', false, text);
            } else {
                setTimeout(() => {
                    wrapUnwrappedImages();
                    saveCurrentData();
                }, 20);
            }
        });

        /* --- 画像リサイズ機能関連の処理 --- */
        function wrapImage(img) {
            if (img.parentElement && img.parentElement.classList.contains('resizable-img-wrapper')) {
                return;
            }
            const wrapper = document.createElement('span');
            wrapper.className = 'resizable-img-wrapper';
            wrapper.contentEditable = "false"; 

            const handle = document.createElement('span');
            handle.className = 'resize-handle';

            img.parentNode.insertBefore(wrapper, img);
            wrapper.appendChild(img);
            wrapper.appendChild(handle);
        }

        function wrapUnwrappedImages() {
            const imgs = editor.querySelectorAll('img');
            imgs.forEach(img => {
                wrapImage(img);
            });
        }

        function deselectAllImages() {
            const selectedWrappers = editor.querySelectorAll('.resizable-img-wrapper.selected');
            selectedWrappers.forEach(w => w.classList.remove('selected'));
        }

        function setupImageResizer() {
            let activeWrapper = null;
            let isResizing = false;
            let startX, startWidth;

            // 画像クリック時の選択切り替え処理
            editor.addEventListener('click', function(e) {
                const wrapper = e.target.closest('.resizable-img-wrapper');
                if (wrapper) {
                    deselectAllImages();
                    wrapper.classList.add('selected');
                } else if (!e.target.classList.contains('resize-handle')) {
                    deselectAllImages();
                }
            });

            // ドラッグリサイズ開始
            editor.addEventListener('mousedown', function(e) {
                if (e.target.classList.contains('resize-handle')) {
                    e.preventDefault();
                    isResizing = true;
                    activeWrapper = e.target.closest('.resizable-img-wrapper');
                    startX = e.clientX;
                    startWidth = activeWrapper.offsetWidth;

                    document.addEventListener('mousemove', handleMouseMove);
                    document.addEventListener('mouseup', handleMouseUp);
                }
            });

            function handleMouseMove(e) {
                if (!isResizing || !activeWrapper) return;
                const currentX = e.clientX;
                const diffX = currentX - startX;
                const newWidth = Math.max(50, startWidth + diffX); 
                activeWrapper.style.width = newWidth + 'px';
            }

            function handleMouseUp() {
                if (isResizing) {
                    isResizing = false;
                    activeWrapper = null;
                    document.removeEventListener('mousemove', handleMouseMove);
                    document.removeEventListener('mouseup', handleMouseUp);
                    saveCurrentData();
                }
            }
        }
    </script>
</body>
</html>

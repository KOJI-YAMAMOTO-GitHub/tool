<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Notes</title>
    
    <style>
        body {
            /* フォントの指定を削除し、ブラウザ標準のものを使用 */
            font-size: 16px; 
            line-height: 1.2;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* 上部コントロールエリア */
        .controls {
            padding: 10px;
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            align-items: center;
        }

        input[type="button"] {
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #eee;
            border-radius: 4px;
            font-family: inherit;
        }

        input[type="button"]:hover {
            background: #e0e0e0;
        }

        /* メインのレイアウト（左サイドバー、右エディタ） */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 左側メモ一覧（サイドバー） */
        .sidebar {
            width: 125px;
            background: #fafafa;
            border-right: 1px solid #ddd;
            overflow-y: auto;
            padding: 10px 0;
            box-sizing: border-box;
            transition: margin-left 0.2s ease; /* 開閉時のアニメーション */
        }

        /* サイドバーを閉じているときのスタイル */
        .sidebar.closed {
            margin-left: -126px; /* 横幅+ボーダー分を左に隠す */
        }

        .sidebar-title {
            font-size: 12px;
            color: #666;
            padding: 0 10px 5px 10px;
            border-bottom: 1px solid #eee;
            margin-bottom: 5px;
        }

        .note-item {
            padding: 12px 10px;
            cursor: pointer;
            font-size: 13px;
            border-bottom: 1px solid #f0f0f0;
            word-break: break-all;
        }

        .note-item:hover {
            background: #f0f0f0;
        }

        /* 現在選択中のメモスタイル */
        .note-item.active {
            background: #e0e0e0;
            font-weight: bold;
        }

        /* 右側エディタエリア */
        .editor-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        #pagetitle {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            font-size: 16px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            font-family: inherit;
        }

        #textarea {
            outline: none;
            width: 100%;
            flex: 1;
            min-height: 350px;
            padding: 10px 0;
            box-sizing: border-box;
            background-color: #fff;
            border: none;
            font-size: 18px;
            white-space: pre-wrap;
            word-break: break-all;
            overflow-wrap: break-word;
        }

        #textarea img {
            max-width: 100%;
            height: auto;
        }

        hr {
            border: 0;
            border-top: 1px solid #eee;
            margin: 10px 0;
            width: 100%;
        }

        /* 【オフラインPDF対応】印刷用のCSS設定 */
        @media print {
            body {
                height: auto;
                background: #fff;
            }
            /* ボタンやサイドバー、タイトル入力欄の枠など不要な要素を非表示 */
            .controls, .sidebar, label, hr {
                display: none !important;
            }
            #pagetitle {
                border: none !important;
                padding: 0 !important;
                font-size: 24px !important;
                font-weight: bold !important;
                margin-bottom: 20px !important;
            }
            .main-container, .editor-container {
                display: block !important;
                overflow: visible !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            #textarea {
                min-height: auto !important;
                padding: 0 !important;
            }
        }
    </style>
</head>

<body>
    <div class="controls">
        <input type="button" value="一覧表示/非表示" onclick="toggleSidebar();" style="background: #ddd; font-weight: bold;"/>
        
        <input type="button" value="新規メモ" onclick="createNewNote();"/>
        <input type="button" value="全データ消去" onclick="localStorageClearAll();"/>
        <input type="button" value="全体をHTML出力" onclick="exportHTML();"/>
        <input type="button" value="本文のみHTML出力" onclick="exportTextareaHTML();"/>
        <input type="button" value="PDF出力" onclick="exportPDF();"/>
        <input type="button" value="メモ削除" onclick="deleteCurrentNote();"/>
    </div>

    <div class="main-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-title">メモ一覧</div>
            <div id="noteList"></div>
        </div>

        <div class="editor-container">
            <label style="font-size: 12px; color: #666;">保存ファイル名（メモのタイトル）：</label>
            <input type="text" id="pagetitle" value="MyNote" oninput="updateTitle(this.value)">
            <hr>
            <div id="textarea" contentEditable="true"></div>
        </div>
    </div>

    <script type="text/javascript">
        const sidebar = document.getElementById('sidebar');
        const editor = document.getElementById('textarea');
        const titleInput = document.getElementById('pagetitle');
        const noteListContainer = document.getElementById('noteList');

        let notes = [];         
        let currentNoteId = ""; 

        // ページ読み込み時の処理
        window.addEventListener('load', function(){
            const savedNotes = localStorage.getItem('multi_notes');
            const savedCurrentId = localStorage.getItem('current_note_id');
            
            const sidebarStatus = localStorage.getItem('sidebar_status');
            if (sidebarStatus === 'closed') {
                sidebar.classList.add('closed');
            }

            if (savedNotes) {
                notes = JSON.parse(savedNotes);
            }

            if (notes.length === 0) {
                const defaultId = Date.now().toString();
                notes.push({
                    id: defaultId,
                    title: "MyNote",
                    content: "ここに内容を入力してください。"
                });
                currentNoteId = defaultId;
            } else {
                currentNoteId = savedCurrentId && notes.some(n => n.id === savedCurrentId) ? savedCurrentId : notes[0].id;
            }

            updateSidebarList();
            loadNote(currentNoteId);
        });

        window.addEventListener('beforeunload', function() {
            saveCurrentData();
        });

        function toggleSidebar() {
            sidebar.classList.toggle('closed');
            if (sidebar.classList.contains('closed')) {
                localStorage.setItem('sidebar_status', 'closed');
            } else {
                localStorage.setItem('sidebar_status', 'opened');
            }
        }

        function saveCurrentData() {
            const currentNote = notes.find(n => n.id === currentNoteId);
            if (currentNote) {
                currentNote.title = titleInput.value;
                currentNote.content = editor.innerHTML;
            }
            localStorage.setItem('multi_notes', JSON.stringify(notes));
            localStorage.setItem('current_note_id', currentNoteId);
        }

        function loadNote(id) {
            const note = notes.find(n => n.id === id);
            if (note) {
                currentNoteId = id;
                titleInput.value = note.title;
                editor.innerHTML = note.content;
                
                const items = noteListContainer.querySelectorAll('.note-item');
                items.forEach(item => {
                    if (item.getAttribute('data-id') === id) {
                        item.classList.add('active');
                    } else {
                        item.classList.remove('active');
                    }
                });
            }
        }

        function updateSidebarList() {
            noteListContainer.innerHTML = "";
            notes.forEach(note => {
                const div = document.createElement('div');
                div.className = 'note-item';
                div.setAttribute('data-id', note.id);
                div.textContent = note.title || "(無題のメモ)";
                
                div.addEventListener('click', function() {
                    changeNote(note.id);
                });

                if (note.id === currentNoteId) {
                    div.classList.add('active');
                }
                
                noteListContainer.appendChild(div);
            });
        }

        function updateTitle(newTitle) {
            const currentNote = notes.find(n => n.id === currentNoteId);
            if (currentNote) {
                currentNote.title = newTitle;
                const item = noteListContainer.querySelector(`.note-item[data-id="${currentNoteId}"]`);
                if (item) item.textContent = newTitle || "(無題のメモ)";
            }
        }

        function changeNote(id) {
            if (id === currentNoteId) return; 
            saveCurrentData(); 
            loadNote(id);
        }

        function createNewNote() {
            saveCurrentData(); 
            
            const newId = Date.now().toString();
            const newNote = {
                id: newId,
                title: "新規メモ",
                content: ""
            };
            notes.push(newNote);
            
            updateSidebarList();
            loadNote(newId);
        }

        function deleteCurrentNote() {
            if (notes.length <= 1) {
                alert("これ以上メモを削除できません（最低1つのメモが必要です）。");
                return;
            }

            if (confirm(`「${titleInput.value}」を削除しますか？`)) {
                notes = notes.filter(n => n.id !== currentNoteId);
                currentNoteId = notes[0].id;
                
                updateSidebarList();
                loadNote(currentNoteId);
                saveCurrentData();
            }
        }

        // アプリ全体のHTML出力（改行エラーを修正）
        function exportHTML(){
            saveCurrentData();
            const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { "type" : "text/html" });
            saveFile(URL.createObjectURL(blob), titleInput.value + "_app.html");
        }

        // Textarea（エディタ）内のHTML（リッチテキスト）のみをHTMLファイルとして出力
        function exportTextareaHTML(){
            saveCurrentData();
            const noteContent = editor.innerHTML;
            
            // シンプルなHTMLドキュメントの枠組みを作成
            const htmlContent = `<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>${titleInput.value}</title>
    <style>
        body { padding: 20px; line-height: 1.6; }
        img { max-width: 100%; height: auto; }
    </style>
</head>
<body>
    <h1>${titleInput.value}</h1>
    <hr>
    <div>${noteContent}</div>
</body>
</html>`;

            const blob = new Blob([htmlContent], { "type" : "text/html" });
            saveFile(URL.createObjectURL(blob), titleInput.value + ".html");
        }

        // ブラウザ標準の印刷（PDF保存）機能
        function exportPDF() {
            saveCurrentData();
            
            const originalTitle = document.title;
            document.title = titleInput.value;
            
            window.print();
            
            document.title = originalTitle;
        }

        function saveFile(url, filename) {
            let link = document.createElement('a'); 
            link.href = url;
            link.download = filename;
            link.click();
        }

        function localStorageClearAll(){
            if(confirm("すべてのメモデータを完全に消去しますか？（初期状態に戻ります）")){
                // ページ離脱時の自動保存イベントを無効化
                window.removeEventListener('beforeunload', saveCurrentData);

                // ストレージの全データを削除
                localStorage.removeItem('multi_notes');
                localStorage.removeItem('current_note_id');
                localStorage.removeItem('sidebar_status');

                // 配列と現在のIDを初期化して新規メモを作成
                notes = [];
                const defaultId = Date.now().toString();
                notes.push({
                    id: defaultId,
                    title: "MyNote",
                    content: ""
                });
                currentNoteId = defaultId;

                // 画面表示とサイドバーを初期表示に更新
                updateSidebarList();
                loadNote(defaultId);
            }
        }

        document.addEventListener('paste', function (e) {
            setTimeout(() => {
                const images = editor.querySelectorAll('img');
                images.forEach(img => {
                    if (!img.style.width && !img.getAttribute('width')) {
                        img.style.maxWidth = "100%"; 
                    }
                });
            }, 10);
        });
    </script>
</body>
</html>

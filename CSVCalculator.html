<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>CSV電卓</title>
    <style>
        body { 
            font-family: sans-serif; 
            padding: 20px; 
            background-color: #fff;
            color: #333; 
            line-height: 1.6;
            margin: 0;
        }

        /* レイアウト調整：ノート選択とメインエリア */
        .main-container {
            display: flex;
            gap: 20px;
            margin: 0 20px;
        }

        .note-sidebar {
            width: 220px;
            flex-shrink: 0;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .note-list {
            list-style: none;
            padding: 0;
            margin: 10px 0 0 0;
        }

        .note-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            margin-bottom: 5px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .note-item.active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }

        /* タイトル表示部分のスタイル */
        .note-title-text {
            flex-grow: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding-right: 5px;
        }

        /* タイトル編集用入力欄のスタイル */
        .note-title-input {
            width: 80%;
            font-size: 0.9rem;
            padding: 2px 5px;
            border: 1px solid #007bff;
            border-radius: 3px;
            box-sizing: border-box;
        }

        .delete-note-btn {
            background: none;
            border: none;
            color: #dc3545;
            cursor: pointer;
            font-weight: bold;
            padding: 0 5px;
            flex-shrink: 0;
        }
        .note-item.active .delete-note-btn {
            color: #fff;
        }

        .calc-area {
            flex-grow: 1;
        }

        .header-content { 
            padding: 0 0 20px 0;
            background: #fff;
        }

        h2 { margin-top: 0; }
        textarea { 
            width: 100%; 
            height: 150px; 
            margin-bottom: 10px; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
            resize: vertical; 
        }
        
        .summary-box { 
            background-color: #f0f7ff; 
            border: 2px solid #007bff; 
            padding: 15px; 
            margin-bottom: 20px; 
            border-radius: 8px;
            display: none;
            position: sticky;
            top: 10px; 
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .total-amount { font-size: 1.5rem; font-weight: bold; color: #007bff; }

        .table-container {
            margin-bottom: 20px;
            display: none;
        }

        table { 
            border-collapse: collapse; 
            width: 100%; 
            background-color: white;
            table-layout: auto;
        }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }

        th { 
            background-color: #f4f4f4; 
            position: sticky; 
            top: 85px; 
            z-index: 90; 
            box-shadow: 0 1px 0 #ddd;
        }

        td:first-child { font-weight: bold; color: #333; }
        tr:nth-child(even) { background-color: #fafafa; }
        
        th.nowrap, td.nowrap {
            white-space: nowrap;
        }

        .error { color: #dc3545; margin-bottom: 10px; font-weight: bold; }
        
        button.primary-btn { padding: 10px 25px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 1rem; }
        button.primary-btn:hover { background: #0056b3; }
        button.secondary-btn { width: 100%; padding: 8px; cursor: pointer; background: #6c757d; color: white; border: none; border-radius: 4px; font-size: 0.9rem; }
        button.secondary-btn:hover { background: #5a6268; }

        /* JSON操作エリアのスタイル */
        .json-actions {
            margin-top: 10px;
            display: flex;
            gap: 5px;
        }
        .json-actions button, .json-actions label {
            flex: 1;
            padding: 6px;
            font-size: 0.8rem;
            text-align: center;
            background: #e2e8f0;
            color: #4a5568;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            cursor: pointer;
            box-sizing: border-box;
        }
        .json-actions button:hover, .json-actions label:hover {
            background: #cbd5e0;
        }
        .json-actions input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="note-sidebar">
            <h3>ノート一覧</h3>
            <p style="font-size: 0.75rem; color: #666; margin-top: -10px;">※タイトルをダブルクリックで編集</p>
            <button class="secondary-btn" onclick="createNewNote()">＋ 新しいノート</button>
            
            <div class="json-actions">
                <button onclick="exportNotesToJSON()">JSON保存</button>
                <label>
                    <input type="file" id="importJsonFile" accept=".json" onchange="importNotesFromJSON(event)">
                    JSON読込
                </label>
            </div>

            <ul id="noteList" class="note-list"></ul>
        </div>

        <div class="calc-area">
            <div class="header-content">
                <h2>CSV電卓</h2>
                <p>形式：金額,個数,項目（金額のみでもOK）</p>
                <textarea id="csvInput" placeholder="500,2,往復交通費&#10;100&#10;300,2,&#10;200,2&#10;100,,大人" oninput="saveCurrentNote()"></textarea>
                <br>
                <button class="primary-btn" onclick="processCSV()">計算実行</button>
            </div>

            <div id="errorMsg" class="error"></div>

            <div id="summaryBox" class="summary-box">
                <span>総合計金額: </span>
                <span id="totalDisplay" class="total-amount">0</span><span> 円</span>
            </div>

            <div id="resultArea" class="table-container"></div>
        </div>
    </div>

    <script>
        let notes = [
            { id: 1, name: 'ノート 1', content: '' }
        ];
        let currentNoteId = 1;
        let editingNoteId = null; // 現在編集中のノートID

        window.onload = function() {
            const savedNotes = localStorage.getItem('csv_calculator_notes');
            const savedCurrentId = localStorage.getItem('csv_calculator_current_id');
            
            if (savedNotes) {
                notes = JSON.parse(savedNotes);
            }
            if (savedCurrentId) {
                currentNoteId = parseInt(savedCurrentId);
            }

            renderNoteList();
            loadNoteContent();
        };

        function renderNoteList() {
            const noteList = document.getElementById('noteList');
            noteList.innerHTML = '';

            notes.forEach(note => {
                const li = document.createElement('li');
                li.className = `note-item ${note.id === currentNoteId ? 'active' : ''}`;
                
                li.onclick = () => {
                    if (editingNoteId !== note.id) {
                        switchNote(note.id);
                    }
                };

                if (editingNoteId === note.id) {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'note-title-input';
                    input.value = note.name;
                    
                    input.onclick = (e) => e.stopPropagation();
                    
                    input.onkeydown = (e) => {
                        if (e.key === 'Enter') {
                            saveNoteTitle(note.id, input.value);
                        } else if (e.key === 'Escape') {
                            editingNoteId = null;
                            renderNoteList();
                        }
                    };
                    
                    input.onblur = () => {
                        saveNoteTitle(note.id, input.value);
                    };

                    li.appendChild(input);
                    setTimeout(() => input.focus(), 0);
                } else {
                    const span = document.createElement('span');
                    span.className = 'note-title-text';
                    span.textContent = note.name;
                    span.title = "ダブルクリックで名前変更";
                    
                    span.ondblclick = (e) => {
                        e.stopPropagation();
                        editingNoteId = note.id;
                        renderNoteList();
                    };

                    li.appendChild(span);
                }

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-note-btn';
                deleteBtn.innerHTML = '&times;';
                deleteBtn.title = '削除';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteNote(note.id);
                };

                if (notes.length > 1) {
                    li.appendChild(deleteBtn);
                }
                noteList.appendChild(li);
            });
        }

        function saveNoteTitle(id, newName) {
            const trimmedName = newName.trim();
            if (trimmedName !== '') {
                const note = notes.find(n => n.id === id);
                if (note) {
                    note.name = trimmedName;
                    localStorage.setItem('csv_calculator_notes', JSON.stringify(notes));
                }
            }
            editingNoteId = null;
            renderNoteList();
        }

        function loadNoteContent() {
            const currentNote = notes.find(n => n.id === currentNoteId);
            if (currentNote) {
                document.getElementById('csvInput').value = currentNote.content;
                if (currentNote.content.trim() !== '') {
                    processCSV();
                } else {
                    document.getElementById('errorMsg').textContent = '';
                    document.getElementById('resultArea').style.display = 'none';
                    document.getElementById('summaryBox').style.display = 'none';
                }
            }
        }

        function saveCurrentNote() {
            const currentNote = notes.find(n => n.id === currentNoteId);
            if (currentNote) {
                currentNote.content = document.getElementById('csvInput').value;
                localStorage.setItem('csv_calculator_notes', JSON.stringify(notes));
            }
        }

        function createNewNote() {
            const newId = notes.length > 0 ? Math.max(...notes.map(n => n.id)) + 1 : 1;
            const newNote = {
                id: newId,
                name: `ノート ${newId}`,
                content: ''
            };
            notes.push(newNote);
            currentNoteId = newId;

            localStorage.setItem('csv_calculator_notes', JSON.stringify(notes));
            localStorage.setItem('csv_calculator_current_id', currentNoteId);

            renderNoteList();
            loadNoteContent();
        }

        function switchNote(id) {
            if (currentNoteId === id) return;
            currentNoteId = id;
            localStorage.setItem('csv_calculator_current_id', currentNoteId);
            
            renderNoteList();
            loadNoteContent();
        }

        function deleteNote(id) {
            if (notes.length <= 1) return;
            if (!confirm('このノートを削除してもよろしいですか？')) return;

            notes = notes.filter(n => n.id !== id);

            if (currentNoteId === id) {
                currentNoteId = notes[0].id;
            }

            localStorage.setItem('csv_calculator_notes', JSON.stringify(notes));
            localStorage.setItem('csv_calculator_current_id', currentNoteId);

            renderNoteList();
            loadNoteContent();
        }

        // JSONエクスポート機能
        function exportNotesToJSON() {
            saveCurrentNote();

            const currentNote = notes.find(n => n.id === currentNoteId);
            const noteName = currentNote ? currentNote.name.trim() : 'csv_notes';

            const dataStr = JSON.stringify(notes, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            const timestamp = `${year}${month}${date}_${hours}${minutes}${seconds}`;

            const a = document.createElement('a');
            a.href = url;
            a.download = `${noteName}_${timestamp}.json`;
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // JSONインポート機能
        function importNotesFromJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedNotes = JSON.parse(e.target.result);
                    
                    if (!Array.isArray(importedNotes) || (importedNotes.length > 0 && !('content' in importedNotes[0]))) {
                        throw new Error('不適切なデータ形式です。');
                    }

                    if (confirm('JSONデータを読み込みますか？\n（現在のノート一覧は上書きされます）')) {
                        notes = importedNotes;
                        const hasCurrentId = notes.some(n => n.id === currentNoteId);
                        if (!hasCurrentId && notes.length > 0) {
                            currentNoteId = notes[0].id;
                        }

                        localStorage.setItem('csv_calculator_notes', JSON.stringify(notes));
                        localStorage.setItem('csv_calculator_current_id', currentNoteId);
                        
                        renderNoteList();
                        loadNoteContent();
                        alert('インポートが完了しました。');
                    }
                } catch (error) {
                    alert('JSONファイルの読み込みに失敗しました。ファイルが正しいか確認してください。');
                }
            };
            reader.readAsText(file);
            
            event.target.value = '';
        }

        // 計算ロジック
        function processCSV() {
            const input = document.getElementById('csvInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const resultArea = document.getElementById('resultArea');
            const summaryBox = document.getElementById('summaryBox');
            const totalDisplay = document.getElementById('totalDisplay');
            
            errorMsg.textContent = '';
            resultArea.innerHTML = '';
            resultArea.style.display = 'none';
            summaryBox.style.display = 'none';

            if (!input) {
                errorMsg.textContent = 'CSVデータを入力してください。';
                return;
            }

            const lines = input.split('\n');
            let totalAll = 0;

            let html = `<table>
                <thead>
                    <tr>
                        <th class="nowrap">小計</th>
                        <th class="nowrap">単価</th>
                        <th class="nowrap">個数</th>
                        <th>項目</th>
                    </tr>
                </thead>
                <tbody>`;

            try {
                lines.forEach((line, index) => {
                    const trimmedLine = line.trim();
                    if (trimmedLine === '') return; 

                    const columns = trimmedLine.split(',');
                    
                    const rawPrice = columns[0] ? columns[0].trim() : "";
                    const rawQuantity = columns[1] ? columns[1].trim() : "";

                    // 金額、または個数のどちらかに「-」が指定されているか確認
                    const isDash = (rawPrice === "-" || rawQuantity === "-");

                    let subtotalStr = "";
                    let priceStr = "";
                    let quantityStr = "";

                    if (isDash) {
                        // 「-」が入力されている場合は、小計を「-」にして総合計の計算からは除外する
                        subtotalStr = "-";
                        
                        // 単価表示の成形
                        if (rawPrice === "-") {
                            priceStr = "-";
                        } else {
                            const price = parseInt(rawPrice);
                            if (isNaN(price)) {
                                throw new Error(`${index + 1}行目の「金額」が正しくありません。`);
                            }
                            priceStr = `${price.toLocaleString()}円`;
                        }

                        // 個数表示の成形
                        if (rawQuantity === "-") {
                            quantityStr = "-";
                        } else {
                            let quantity = parseInt(rawQuantity);
                            if (isNaN(quantity)) quantity = 1;
                            quantityStr = quantity.toLocaleString();
                        }
                    } else {
                        // 通常の数値計算
                        const price = parseInt(rawPrice);
                        if (isNaN(price)) {
                            throw new Error(`${index + 1}行目の「金額」が正しくありません。`);
                        }

                        let quantity = parseInt(rawQuantity);
                        if (isNaN(quantity)) quantity = 1;

                        const subtotal = price * quantity;
                        totalAll += subtotal;

                        subtotalStr = `${subtotal.toLocaleString()}円`;
                        priceStr = `${price.toLocaleString()}円`;
                        quantityStr = quantity.toLocaleString();
                    }

                    // 項目欄
                    let name = columns[2] ? columns[2] : "";
                    if (name === "") name = "-";

                    html += `<tr>
                        <td class="nowrap">${subtotalStr}</td>
                        <td class="nowrap">${priceStr}</td>
                        <td class="nowrap">${quantityStr}</td>
                        <td>${name}</td>
                    </tr>`;
                });

                html += `</tbody></table>`;

                totalDisplay.textContent = totalAll.toLocaleString();
                summaryBox.style.display = 'block';

                resultArea.innerHTML = html;
                resultArea.style.display = 'block';

            } catch (e) {
                errorMsg.textContent = e.message;
                summaryBox.style.display = 'none';
                resultArea.style.display = 'none';
            }
        }
    </script>
</body>
</html>

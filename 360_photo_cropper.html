<style>

</div><div class="actions"><button id="save" disabled>画像をダウンロード</button><button id="resetall" class="secondary" disabled>すべてリセット</button></div><div id="status" class="status" role="status"></div></section>

function tr(ja,en){return language==='ja'?ja:en;}
function applyLanguage(){

 while(node=walker.nextNode()){const raw=node.nodeValue,trim=raw.trim();const entry=translations[trim]||Object.values(translations).find(pair=>pair[0]===trim||pair[1]===trim);if(entry)node.nodeValue=raw.replace(trim,entry[language==='ja'?0:1]);}

const $=s=>document.querySelector(s),file=$('#file'),stage=$('#stage'),ctx=stage.getContext('2d',{willReadFrequently:true}),status=$('#status'),filename=$('#filename');

function ratio(){return ratioSelect.value.split(':').map(Number)}

function setEnabled(on){Object.values(controls).forEach(e=>e.disabled=!on);Object.values(nums).forEach(e=>e.disabled=!on);ratioSelect.disabled=!on;showgrid.disabled=!on;[reset,resetall,save].forEach(e=>e.disabled=!on)}

function render(outW=stage.width,outH=stage.height,putPreview=true){if(!sourceData)return;const W=outW,H=outH,src=sourceData.data,sw=sourceData.width,sh=sourceData.height;const result=new ImageData(W,H),dst=result.data;
const yaw=Number(controls.yaw.value)*Math.PI/180,pitch=Number(controls.pitch.value)*Math.PI/180,roll=Number(controls.roll.value)*Math.PI/180,fov=Number(controls.fov.value)*Math.PI/180;
const focal=W/(2*Math.tan(fov/2)),cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),cr=Math.cos(roll),sr=Math.sin(roll);

 const radius=Math.min(W,H)/2,scale=90/Math.max(30,Number(controls.fov.value)),yawOffset=yaw,rollAngle=roll;
 for(let y=0;y<H;y++){const ny=(y-H/2)/radius;for(let x=0;x<W;x++){const nx=(x-W/2)/radius;const rr=Math.hypot(nx,ny)*scale;const a=Math.atan2(nx,-ny)+yawOffset+rollAngle;let v=projection.value==='planet'?1-rr:rr;v=Math.max(0,Math.min(1,v));v-=Number(controls.pitch.value)/180;v=Math.max(0,Math.min(1,v));let u=(a/(2*Math.PI)+0.5)*sw;u=((u%sw)+sw)%sw;const vv=v*(sh-1);const x0=Math.floor(u),x1=(x0+1)%sw,fx=u-x0,y0=Math.floor(vv),y1=Math.min(sh-1,y0+1),fy=vv-y0;const i00=(y0*sw+x0)*4,i10=(y0*sw+x1)*4,i01=(y1*sw+x0)*4,i11=(y1*sw+x1)*4,di=(y*W+x)*4;for(let c=0;c<3;c++){const top=src[i00+c]*(1-fx)+src[i10+c]*fx,bottom=src[i01+c]*(1-fx)+src[i11+c]*fx;dst[di+c]=Math.round(top*(1-fy)+bottom*fy);}dst[di+3]=255;}}

}
const useCylindrical=fov>120*Math.PI/180;
const cylindricalVerticalSpan=Math.min(fov*H/W,120*Math.PI/180);
for(let y=0;y<H;y++){const ly=useCylindrical?(H/2-y)*cylindricalVerticalSpan/H:(H/2-y)/focal;for(let x=0;x<W;x++){const lx=useCylindrical?(x-W/2)*fov/W:(x-W/2)/focal;let rx=useCylindrical?Math.sin(lx):lx,ry=ly,rz=useCylindrical?Math.cos(lx):1;const norm=Math.hypot(rx,ry,rz);rx/=norm;ry/=norm;rz/=norm;

const py=ry*cp-rz*sp,pz=ry*sp+rz*cp;ry=py;rz=pz;
const wx=rx*cy+rz*sy,wz=-rx*sy+rz*cy,wy=ry;
let u=(Math.atan2(wx,wz)/(2*Math.PI)+0.5)*sw;u=((u%sw)+sw)%sw;const v=Math.max(0,Math.min(sh-1,(0.5-Math.asin(Math.max(-1,Math.min(1,wy)))/Math.PI)*sh));

for(let c=0;c<3;c++){const top=src[i00+c]*(1-fx)+src[i10+c]*fx,bottom=src[i01+c]*(1-fx)+src[i11+c]*fx;dst[di+c]=Math.round(top*(1-fy)+bottom*fy);}dst[di+3]=255;}}

function update(){labels();queueDraw();}

file.addEventListener('change',()=>{const f=file.files&&file.files[0];if(!f)return;if(!f.type.startsWith('image/')){status.textContent=tr('画像ファイルを選択してください。','Please select an image file.');return;}originalBaseName=f.name.replace(/\.[^.]+$/, '')||'photo';const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{img=im;sourceCanvas=document.createElement('canvas');sourceCanvas.width=im.naturalWidth;sourceCanvas.height=im.naturalHeight;const sctx=sourceCanvas.getContext('2d',{willReadFrequently:true});sctx.drawImage(im,0,0);try{sourceData=sctx.getImageData(0,0,sourceCanvas.width,sourceCanvas.height);}catch(e){status.textContent=tr('画像を処理できませんでした。別の画像をお試しください。','Could not process this image. Please try another image.');URL.revokeObjectURL(url);return;}filename.textContent=f.name+'（'+im.naturalWidth+' × '+im.naturalHeight+'）';setEnabled(true);resetView();status.textContent=tr('読み込みました。ドラッグして360°見回し、切り出す方向を選んでください。','Image loaded. Drag to look around the 360° photo and choose the crop direction.');URL.revokeObjectURL(url);};im.onerror=()=>{URL.revokeObjectURL(url);status.textContent=tr('画像を読み込めませんでした。別の画像をお試しください。','Could not load the image. Please try another image.');};im.src=url;});

stage.addEventListener('pointerdown',e=>{if(!sourceData)return;stage.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,yaw:Number(controls.yaw.value),pitch:Number(controls.pitch.value)};});stage.addEventListener('pointermove',e=>{if(!drag)return;const r=stage.getBoundingClientRect();controls.yaw.value=Math.max(-180,Math.min(180,drag.yaw-(e.clientX-drag.x)*180/r.width));controls.pitch.value=Math.max(-85,Math.min(85,drag.pitch+(e.clientY-drag.y)*100/r.height));update();});for(const ev of ['pointerup','pointercancel','lostpointercapture'])stage.addEventListener(ev,()=>drag=null);
save.addEventListener('click',()=>{if(!sourceData)return;status.textContent=tr('高解像度画像を作成しています…','Rendering high-resolution image…');setTimeout(()=>{try{const r=ratio();let outW,outH;if(projection.value!=='perspective'){outW=3000;outH=3000;}else if(r[0]===4){outW=3840;outH=2880;}else if(r[0]===3&&r[1]===4){outW=2880;outH=3840;}else if(r[0]===16){outW=3840;outH=2160;}else if(r[0]===9&&r[1]===16){outW=2160;outH=3840;}else{outW=3000;outH=3000;}const result=render(outW,outH,false),out=document.createElement('canvas');out.width=outW;out.height=outH;out.getContext('2d').putImageData(result,0,0);out.toBlob(blob=>{if(!blob){status.textContent=tr('画像の書き出しに失敗しました。','Failed to export image.');return;}const a=document.createElement('a'),url=URL.createObjectURL(blob),now=new Date(),pad=n=>String(n).padStart(2,'0'),stamp=now.getFullYear()+pad(now.getMonth()+1)+pad(now.getDate())+'_'+pad(now.getHours())+pad(now.getMinutes())+pad(now.getSeconds()),cropSize=outW+'x'+outH;a.href=url;const modeTag=projection.value==='perspective'?'crop_'+r.join('x'):projection.value==='planet'?'little_planet':'inverse_planet';a.download=originalBaseName+'_'+modeTag+'_'+cropSize+'_'+stamp+'.jpg';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);status.textContent=language==='ja'?`${projection.value==='perspective'?r.join(':')+'クロップ':projection.value==='planet'?'リトルプラネット':'逆向きプラネット'}画像（${outW} × ${outH}）を保存しました。`:`Saved ${projection.value==='perspective'?r.join(':')+' crop':projection.value==='planet'?'Little Planet':'Inverted Planet'} image (${outW} × ${outH}).`;},'image/jpeg',0.98);}catch(e){status.textContent=tr('書き出しに失敗しました: ','Export failed: ')+e.message;}},30);});
setStageRatio();drawPlaceholder();labels();applyLanguage();
})();
